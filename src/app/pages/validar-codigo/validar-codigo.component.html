<app-header></app-header>

<ion-content color="light">
  <ion-list [inset]="true">
    <ion-item>
      <ion-input label="Clave del Técnico*:" labelPlacement="floating"  class="color-label-floating" [disabled]="sesionCorrecta === 'false'" [value]="sesionCorrecta === 'false' ? '25632865' : ''"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Código*:" labelPlacement="floating"  class="color-label-floating"></ion-input>
    </ion-item>
  </ion-list>

  <ion-list [inset]="true">
    <ion-item>
      <ion-button class="no-capital-letters" size="default" color="secondary" expand="block" fill="outline"  [routerLink]="['/login']">
        Cancelar
      </ion-button>
      <ion-button class="no-capital-letters" size="default" expand="block" fill="outline"  (click)="validar()">
        Validar
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>

<app-footer></app-footer>
