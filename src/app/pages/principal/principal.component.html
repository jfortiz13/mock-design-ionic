<app-header></app-header>

<ion-content color="light">
  <ion-grid fixed class="grid-column-padding">
    <ion-row>
      <ion-col size="12">
        <ion-card class="rounded-card mt-mb-5-px">
          <ion-card-content>
            <ion-list class="rounded-card">
              <ion-item class="rounded-card">
                <!-- <ion-thumbnail slot="end" class="circle-img">
                  <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/card-media.png" />
                </ion-thumbnail> -->
                <ion-grid fixed>
                  <ion-row>
                    <ion-col size="12">
                      <ion-badge color="header">¡Bienvenidos!</ion-badge>
                    </ion-col>
                    <ion-col size="12">
                      <h2><strong>Sistema de Identificación de Ganado</strong></h2>
                    </ion-col>
                  </ion-row>
                </ion-grid>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <ion-list [inset]="true" class="ion-list-actions">
      <div class="ion-text-center">
        <ion-grid fixed>
          <ion-row>
            <ion-col size="12">
              <ion-icon class="big-icon" color="info" name="person-circle-sharp"></ion-icon>
              <div class="boder-bottom-user"></div>
            </ion-col>
            <ion-col size="12">
              <ion-label><ion-badge color="header"><strong>Juan Montero Silva</strong></ion-badge></ion-label>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
    </ion-list>

    <ion-list [inset]="true" class="ion-list-actions ion-border-list-primary">
      <ion-item [button]="true" (click)="onClick()" disabled="true">
        <ion-icon class="ion-icon-custom-list" size="large" color="primary" slot="start"
          name="cloud-download-sharp"></ion-icon>
        <ion-label><ion-badge color="primary"><strong>Descargar asignación</strong></ion-badge></ion-label>
      </ion-item>
    </ion-list>

    <ion-list [inset]="true" class="ion-list-actions ion-border-list-info">
      <ion-item [button]="true" (click)="onClick()">
        <ion-icon class="ion-icon-custom-list" size="large" color="info" slot="start" name="locate-sharp"></ion-icon>
        <ion-label><ion-badge color="info"><strong>Registrar coordenadas</strong></ion-badge></ion-label>
      </ion-item>
    </ion-list>

    <ion-list [inset]="true" class="ion-list-actions ion-border-list-secondary">
      <ion-item [button]="true" (click)="onClick()">
        <ion-icon class="ion-icon-custom-list" size="large" color="secondary" slot="start" name="navigate-sharp"></ion-icon>
        <ion-label><ion-badge color="secondary"><strong>¿Cómo llegar?</strong></ion-badge></ion-label>
      </ion-item>
    </ion-list>

    <ion-list [inset]="true" class="ion-list-actions ion-border-list-success">
      <ion-item [button]="true" (click)="onClick()">
        <ion-icon class="ion-icon-custom-list" size="large" color="success" slot="start" name="card-sharp"></ion-icon>
        <ion-label><ion-badge color="success"><strong>Registro de identificación</strong></ion-badge></ion-label>
      </ion-item>
    </ion-list>

    <ion-list [inset]="true" class="ion-list-actions ion-border-list-warning">
      <ion-item [button]="true" (click)="onClick()">
        <ion-icon class="ion-icon-custom-list" size="large" color="header" slot="start" name="sync-circle-sharp"></ion-icon>
        <ion-label><ion-badge color="header"><strong>Enviar y sincronizar</strong></ion-badge></ion-label>
      </ion-item>
    </ion-list>
  </ion-grid>
</ion-content>


<app-footer></app-footer>
